[project]
name = "agentic-ai-assessment"
version = "0.1.0"
description = "Document agent: Session 1 tools + knowledge base + MCP + observability. Extend it."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "aiosqlite>=0.21.0",
    "altair>=6.3.0",
    "fastapi>=0.142.2",
    "gradio>=6.31.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.1.9",
    "langchain>=1.4.5",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "mcp>=1.9.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "openml>=0.15.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pandas>=3.1.0",
    "platformdirs>=4.14.4",
    "pydantic>=2.13.5",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.15.0",
    "rapidocr>=3.10.0",
    "sqlglot>=30.29.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tokenizers>=0.23.3",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# what the black-box test container needs (nothing from the app)
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
]
hooks = [
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["phase1: runs before the container restart", "phase2: runs after the container restart"]
