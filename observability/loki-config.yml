auth_enabled: false
server: { http_listen_port: 3100 }
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules }
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }
limits_config:
  allow_structured_metadata: true   # OTLP attributes + trace_id arrive as structured metadata
  volume_enabled: true              # Grafana's log-volume histogram (Logs panels / Explore) calls /index/volume; without this it errors
