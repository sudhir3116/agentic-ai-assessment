receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  batch: { send_batch_size: 256, timeout: 5s }

connectors:
  spanmetrics:            # RED metrics from traces (rate / errors / duration), per model
    namespace: spans
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
    dimensions:
      - name: gen_ai.request.model   # service.name is added automatically - do not list it

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls: { insecure: true }
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: agent        # every app metric becomes agent_<name>
    resource_to_telemetry_conversion: { enabled: true }   # service.name -> service_name label

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
